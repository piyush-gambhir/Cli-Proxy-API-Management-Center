name: Sync upstream and release

# This fork's main is upstream main plus the "ledger" redesign. This job keeps it current and
# publishes management.html as the latest release, which CLIProxyAPI's panel updater downloads
# when `management.panel-github-repository` points at this fork (it checks every 3 hours).
#
# Tags pushed with GITHUB_TOKEN do not trigger other workflows, so the release happens here
# rather than in release.yml.

on:
  schedule:
    - cron: '23 1 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Merge upstream main
        id: merge
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/router-for-me/Cli-Proxy-API-Management-Center.git
          git fetch --tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
          elif git merge --no-edit upstream/main; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "::error::Upstream main ($(git rev-parse --short upstream/main)) conflicts with this fork. Merge it locally: git fetch upstream && git merge upstream/main, resolve, push."
            exit 1
          fi

      - name: Decide whether to release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Compare against the latest published release, not the latest tag: a tag whose
          # release step failed must not block the next run. With an `upstream` remote present,
          # gh would default to the parent repo, so --repo is always explicit here.
          last="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)"
          if [ -n "$last" ] && [ "$(git rev-list -n 1 "$last")" = "$(git rev-parse HEAD)" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Nothing new since $last."
            exit 0
          fi
          base="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-ledger.*' HEAD 2>/dev/null || echo v0.0.0)"
          n="$(git tag --list "${base}-ledger.*" | sed 's/.*-ledger\.//' | sort -n | tail -n 1)"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${base}-ledger.$(( ${n:-0} + 1 ))" >> "$GITHUB_OUTPUT"
          echo "previous=${last}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.plan.outputs.release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'

      - name: Setup Bun
        if: steps.plan.outputs.release == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Verify
        if: steps.plan.outputs.release == 'true'
        run: |
          bun install --frozen-lockfile
          bun run verify

      - name: Build management.html
        if: steps.plan.outputs.release == 'true'
        env:
          VERSION: ${{ steps.plan.outputs.tag }}
        run: |
          bun run build
          mv dist/index.html dist/management.html
          ls -lh dist/management.html

      - name: Push merge and tag
        if: steps.plan.outputs.release == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.merge.outputs.merged }}" = "true" ]; then
            git push origin HEAD:main
          fi
          git tag "${{ steps.plan.outputs.tag }}"
          git push origin "${{ steps.plan.outputs.tag }}"

      - name: Publish release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.plan.outputs.tag }}"
          previous="${{ steps.plan.outputs.previous }}"
          if [ -n "$previous" ]; then
            git log --pretty=format:'- %h %s' "${previous}..${tag}" > release-notes.md
          else
            git log -n 30 --pretty=format:'- %h %s' "$tag" > release-notes.md
          fi
          gh release create "$tag" dist/management.html \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$tag" \
            --notes-file release-notes.md \
            --latest
